[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
bold = {  style = "Bold" }
italic = { style = "Italic" }
bold_italic = {  style = "Bold Italic" }

# defaults write org.alacritty AppleFontSmoothing -int 0
# defaults delete org.alacritty AppleFontSmoothing

size = 14

[window]
# option_as_alt = 'OnlyLeft'
option_as_alt = 'Both'
decorations = 'None'
opacity = 1.0

[cursor]
style = 'Beam'

# TokyoNight Alacritty Colors
# Default colors
[colors.primary]
background = '#222436'
foreground = '#c8d3f5'

#[colors.cursor]
#cursor = '#c8d3f5'
#text = '#222436'

# Normal colors
[colors.normal]
black = '#1b1d2b'
red = '#ff757f'
green = '#c3e88d'
yellow = '#ffc777'
blue = '#82aaff'
magenta = '#c099ff'
cyan = '#86e1fc'
white = '#828bb8'

# Bright colors
[colors.bright]
black = '#444a73'
red = '#ff757f'
green = '#c3e88d'
yellow = '#ffc777'
blue = '#82aaff'
magenta = '#c099ff'
cyan = '#86e1fc'
white = '#c8d3f5'

# Indexed Colors
[[colors.indexed_colors]]
index = 16
color = '#ff966c'

[[colors.indexed_colors]]
index = 17
color = '#c53b53'
