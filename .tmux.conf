unbind r
bind r source-file ~/.tmux.conf\; display-message "Config reloaded..." 

set -g prefix C-Space

# vim keybindings
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# set -g default-terminal "screen-256color"
# set -as terminal-features ",xterm-256color:RGB"

# Undercurl
set -g default-terminal "${TERM}"
# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours - needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Clipboard: forward inner-app OSC 52 out to the host terminal (ghostty)
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Let inner apps talk to the host terminal directly. Yazi probes with
# DA1/DSR at startup and errors with "Terminal response timeout" when
# tmux swallows the replies; it also needs TERM/TERM_PROGRAM inside the
# pane to pick an image protocol instead of guessing.
# https://yazi-rs.github.io/docs/image-preview#tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g base-index 1
setw -g pane-base-index 1
# set -g renumber-windows on

unbind %
bind "\\" split-window -h

unbind '"'
bind | split-window -v

set -g mouse on

# Pass through extended keys (e.g. Shift+Enter for Claude Code)
bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# ==================================================
# 		Alt bindings
# ==================================================

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-w choose-window
bind -n M-s choose-session

bind -n "M-\\" split-window -h -c "#{pane_current_path}"
bind -n M-| split-window -v -c "#{pane_current_path}"
bind -n M-x confirm-before "kill-pane"
bind -n M-X respawn-pane -k -c "#{pane_current_path}"  # kill running cmd, restart pane in current dir
bind -n M-z resize-pane -Z

bind -n M-Space next-layout
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# bind -n M-9 switch-client -p # `9` is for `(`
# bind -n M-0 switch-client -n # `0` is for `)`

bind-key 1 if-shell "tmux select-window -t :1" "" "new-window -t :1"
bind-key 2 if-shell "tmux select-window -t :2" "" "new-window -t :2"
bind-key 3 if-shell "tmux select-window -t :3" "" "new-window -t :3"
bind-key 4 if-shell "tmux select-window -t :4" "" "new-window -t :4"
bind-key 5 if-shell "tmux select-window -t :5" "" "new-window -t :5"
bind-key 6 if-shell "tmux select-window -t :6" "" "new-window -t :6"
bind-key 7 if-shell "tmux select-window -t :7" "" "new-window -t :7"
bind-key 8 if-shell "tmux select-window -t :8" "" "new-window -t :8"
bind-key 9 if-shell "tmux select-window -t :9" "" "new-window -t :9"
bind-key 0 if-shell "tmux select-window -t :10" "" "new-window -t :10"

bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-q confirm-before "kill-window"
bind -n M-r command-prompt -I'#W' { rename-window -- '%%' }
bind -n M-p previous-window
bind -n M-n next-window
bind -n M-P swap-window -t -1\; previous-window 
bind -n M-N swap-window -t +1\; next-window

bind -n M-C new-session
bind -n M-Q confirm-before "kill-session"
bind -n M-R command-prompt -I'#S' { rename-session -- '%%' }
# bind -n M-P previous-session
# bind -n M-N next-session

bind -n M-: command-prompt
bind -n M-/ list-keys 

bind -n M-d confirm-before "detach"

bind -n M-f clear-history # 'f' is for 'flush'
bind -n M-y copy-mode

# TODO: change working directory
# use `attach -c <path>`
bind -n M-~ command-prompt -p "Change working directory" "attach -c '%%'"

# set -g @resurrect-save 'S'
# set -g @resurrect-restore 'R'

# ==================================================
# 			Status bar
# ==================================================

# Plain built-in bar, no theme plugin. A solid background makes tmux sessions
# visually distinct from bare terminal windows.
set -g @status-bg-bg "brightblack"
set -g @status-bg "blue"
set -g @status-fg "black"
set -g @status-selected-bg "red"
set -g @status-warning "yellow"
set -g @status-alert "red"
set -g @status-prompt-fill "orange"
set -g @status-muted "brightblack"

set -g status 2
set -g status-position top
# Second row is padding between the bar and the panes. tmux fills spare rows
# with its pane list by default, so the format must be blanked, not left unset.
set -g status-format[1] "#[fg=#{@status-bg-bg},bg=terminal]#{R:▀,#{client_width}}"
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#{@status-bg-bg},fg=#{@status-fg}"
set -g message-style "bg=#{@status-prompt-fill},fg=#{@status-fg},fill=#{@status-prompt-fill}"
set -g mode-style "bg=#{@status-fg},fg=#{@status-bg},bold"
set -g pane-border-style "fg=#{@status-muted}"
set -g pane-active-border-style "fg=#{@status-bg}"

set -g status-left-length 40
set -g status-right-length 100

# Session on the left
set -g status-left "#[fg=#{@status-bg},bg=#{@status-fg},bold]    #h  "

# Windows: index and name; name falls back to cwd basename when auto-renamed.
# Each tab ends with a close button and the last tab is followed by a new-tab
# button. Both are user ranges; the MouseDown1Status binding below reads the
# range name to tell them apart from a plain tab click.
set -g @tab-label "#I:#{?automatic_rename,#{b:pane_current_path},#W}"
set -g @tab-close "#[range=user|x#{window_id}] × #[range=window|#{window_index}]"
set -g @tab-new "#{?loop_last_flag,#[range=user|new]#[fg=#{@status-bg}#,bg=#{@status-bg-bg}#,bold] + #[norange],}"
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@status-fg},bg=#{@status-bg}]#{E:@tab-close}#{E:@tab-label}  #{E:@tab-new}"
set -g window-status-current-format "#[fg=#{@status-fg},bg=#{@status-selected-bg},bold]#{E:@tab-close}#{E:@tab-label}  #{E:@tab-new}"
set -g window-status-activity-style "fg=#{@status-warning}"
set -g window-status-bell-style "fg=#{@status-alert},bold"

# Right: zoom flag, running command, host
set -g status-right "#{?window_zoomed_flag,#[fg=#{@status-fg}#,bg=#{@status-alert}#,bold]    ZOOM  ,}"
set -ag status-right "#[fg=#{@status-fg},bg=#{@status-bg},bold]   #[nobold] #{pane_current_command}  "
set -ag status-right "#[fg=#{@status-bg},bg=#{@status-fg},bold]   #[nobold] #S  "

# Tab buttons. Window and session ranges keep the default click behaviour.
# The close range carries the window id after the "x", so the menu (a format,
# unlike a plain command target) can address the window it was clicked on.
bind -n MouseDown1Status {
    if -F "#{==:#{mouse_status_range},new}" {
        new-window -c "#{pane_current_path}"
    } {
        if -F "#{m:x@*,#{mouse_status_range}}" {
            display-menu -O -x M -y M -T "Kill window?" \
                Yes y { kill-window -t "#{s/^x//:mouse_status_range}" } \
                No n {}
        } {
            switch-client -t =
        }
    }
}

# ==================================================
# 			Plugins
# ==================================================

# plugins.conf runs the plugins from the nix store; it is generated by
# home-manager (.nix/home-dotfiles.nix). Absent until the first switch
# and on hosts without nix, so -q: no plugins, no error.
source-file -q ~/.config/tmux/plugins.conf

