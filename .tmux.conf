unbind r
bind r source-file ~/.tmux.conf\; display-message "Config reloaded..." 

set -g prefix C-Space

# vim keybindings
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# set -g default-terminal "screen-256color"
# set -as terminal-features ",xterm-256color:RGB"

# Undercurl
set -g default-terminal "${TERM}"
# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours - needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Clipboard: forward inner-app OSC 52 out to the host terminal (ghostty)
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Let inner apps talk to the host terminal directly. Yazi probes with
# DA1/DSR at startup and errors with "Terminal response timeout" when
# tmux swallows the replies; it also needs TERM/TERM_PROGRAM inside the
# pane to pick an image protocol instead of guessing.
# https://yazi-rs.github.io/docs/image-preview#tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g base-index 1
setw -g pane-base-index 1
# set -g renumber-windows on

unbind %
bind "\\" split-window -h

unbind '"'
bind | split-window -v

set -g mouse on

# Pass through extended keys (e.g. Shift+Enter for Claude Code)
bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# ==================================================
# 		Alt bindings
# ==================================================

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-w choose-window
bind -n M-s choose-session

bind -n "M-\\" split-window -h -c "#{pane_current_path}"
bind -n M-| split-window -v -c "#{pane_current_path}"
bind -n M-x confirm-before "kill-pane"
bind -n M-X respawn-pane -k -c "#{pane_current_path}"  # kill running cmd, restart pane in current dir
bind -n M-z resize-pane -Z

bind -n M-Space next-layout
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# bind -n M-9 switch-client -p # `9` is for `(`
# bind -n M-0 switch-client -n # `0` is for `)`

bind-key 1 if-shell "tmux select-window -t :1" "" "new-window -t :1"
bind-key 2 if-shell "tmux select-window -t :2" "" "new-window -t :2"
bind-key 3 if-shell "tmux select-window -t :3" "" "new-window -t :3"
bind-key 4 if-shell "tmux select-window -t :4" "" "new-window -t :4"
bind-key 5 if-shell "tmux select-window -t :5" "" "new-window -t :5"
bind-key 6 if-shell "tmux select-window -t :6" "" "new-window -t :6"
bind-key 7 if-shell "tmux select-window -t :7" "" "new-window -t :7"
bind-key 8 if-shell "tmux select-window -t :8" "" "new-window -t :8"
bind-key 9 if-shell "tmux select-window -t :9" "" "new-window -t :9"
bind-key 0 if-shell "tmux select-window -t :10" "" "new-window -t :10"

bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-q confirm-before "kill-window"
bind -n M-r command-prompt -I'#W' { rename-window -- '%%' }
bind -n M-p previous-window
bind -n M-n next-window
bind -n M-P swap-window -t -1\; previous-window 
bind -n M-N swap-window -t +1\; next-window

bind -n M-C new-session
bind -n M-Q confirm-before "kill-session"
bind -n M-R command-prompt -I'#S' { rename-session -- '%%' }
# bind -n M-P previous-session
# bind -n M-N next-session

bind -n M-: command-prompt
bind -n M-/ list-keys 

bind -n M-d confirm-before "detach"

bind -n M-f clear-history # 'f' is for 'flush'
bind -n M-y copy-mode

# TODO: change working directory
# use `attach -c <path>`
bind -n M-~ command-prompt -p "Change working directory" "attach -c '%%'"

# set -g @resurrect-save 'S'
# set -g @resurrect-restore 'R'

# ==================================================
# 			Status bar
# ==================================================

# Plain built-in bar, no theme plugin. Terminal palette colours only, so
# it follows whatever the host terminal is set to.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=default"
set -g message-style "bg=default,fg=yellow"
set -g mode-style "bg=blue,fg=black"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

set -g status-left-length 40
set -g status-right-length 80

# [session] on the left
set -g status-left "#[fg=blue,bold] #S #[default] "

# Windows: index and name; name falls back to cwd basename when auto-renamed
set -g window-status-separator ""
set -g window-status-format "#[fg=brightblack] #I:#{?automatic_rename,#{b:pane_current_path},#W} "
set -g window-status-current-format "#[fg=black,bg=blue,bold] #I:#{?automatic_rename,#{b:pane_current_path},#W} "
set -g window-status-activity-style "fg=yellow"
set -g window-status-bell-style "fg=red,bold"

# Right: zoom flag, running command, host, clock
set -g status-right "#{?window_zoomed_flag,#[fg=red#,bold] ZOOM #[default],}"
set -ag status-right "#[fg=brightblack]#{pane_current_command} "
set -ag status-right "#[fg=default]#h "
set -ag status-right "#[fg=blue,bold]%H:%M "

# ==================================================
# 			Plugins
# ==================================================

# plugins.conf runs the plugins from the nix store; it is generated by
# home-manager (.nix/home-dotfiles.nix). Absent until the first switch
# and on hosts without nix, so -q: no plugins, no error.
source-file -q ~/.config/tmux/plugins.conf

