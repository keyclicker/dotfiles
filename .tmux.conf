unbind r
bind r source-file ~/.tmux.conf\; display-message "Config reloaded..." 

set -g prefix C-Space

# vim keybindings
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# set -g default-terminal "screen-256color"
# set -as terminal-features ",xterm-256color:RGB"

# Undercurl
set -g default-terminal "${TERM}"
# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours - needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g base-index 1
setw -g pane-base-index 1
# set -g renumber-windows on

unbind %
bind "\\" split-window -h

unbind '"'
bind | split-window -v

set -g mouse on

# Pass through extended keys (e.g. Shift+Enter for Claude Code)
bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# ==================================================
# 		Alt bindings
# ==================================================

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-w choose-window
bind -n M-s choose-session

bind -n "M-\\" split-window -h -c "#{pane_current_path}"
bind -n M-| split-window -v -c "#{pane_current_path}"
bind -n M-x confirm-before "kill-pane"
bind -n M-z resize-pane -Z

bind -n M-Space next-layout
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# bind -n M-9 switch-client -p # `9` is for `(`
# bind -n M-0 switch-client -n # `0` is for `)`

bind-key 1 if-shell "tmux select-window -t :1" "" "new-window -t :1"
bind-key 2 if-shell "tmux select-window -t :2" "" "new-window -t :2"
bind-key 3 if-shell "tmux select-window -t :3" "" "new-window -t :3"
bind-key 4 if-shell "tmux select-window -t :4" "" "new-window -t :4"
bind-key 5 if-shell "tmux select-window -t :5" "" "new-window -t :5"
bind-key 6 if-shell "tmux select-window -t :6" "" "new-window -t :6"
bind-key 7 if-shell "tmux select-window -t :7" "" "new-window -t :7"
bind-key 8 if-shell "tmux select-window -t :8" "" "new-window -t :8"
bind-key 9 if-shell "tmux select-window -t :9" "" "new-window -t :9"
bind-key 0 if-shell "tmux select-window -t :10" "" "new-window -t :10"

bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-q confirm-before "kill-window"
bind -n M-r command-prompt -I'#W' { rename-window -- '%%' }
bind -n M-p previous-window
bind -n M-n next-window
bind -n M-P swap-window -t -1\; previous-window 
bind -n M-N swap-window -t +1\; next-window

bind -n M-C new-session
bind -n M-Q confirm-before "kill-session"
bind -n M-R command-prompt -I'#S' { rename-session -- '%%' }
# bind -n M-P previous-session
# bind -n M-N next-session

bind -n M-: command-prompt
bind -n M-/ list-keys 

bind -n M-d confirm-before "detach"

bind -n M-f clear-history # 'f' is for 'flush'
bind -n M-y copy-mode

# TODO: change working directory
# use `attach -c <path>`
bind -n M-~ command-prompt -p "Change working directory" "attach -c '%%'"

# set -g @resurrect-save 'S'
# set -g @resurrect-restore 'R'

# ==================================================
# 			Plugins
# ==================================================

# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @catppuccin_flavor 'frappe' # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #{?automatic_rename,#{b:pane_current_path},#W}"
set -g @catppuccin_window_current_text " #{?automatic_rename,#{b:pane_current_path},#W}"

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_session}"
set -ag  status-right "#{E:@catppuccin_status_application}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
