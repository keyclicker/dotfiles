# Front door of the agents box. Tailscale terminates HTTPS for the node
# name and every svc:* name, forwards all of it here, and the Host header
# picks the server block. Included into nginx's http block by
# .nix/module-gateway.nix, which substitutes @site@.

# ---- Shared proxy behaviour -------------------------------------------------

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# agents.<tailnet> → <tailnet>, to link to the svc:* names
map $host $tailnet {
  ~^[^.]+\.(.+)$ $1;
}

proxy_http_version 1.1;
proxy_set_header   Host       $host;
proxy_set_header   Upgrade    $http_upgrade;
proxy_set_header   Connection $connection_upgrade;

# T3 and noVNC hold websockets open for hours
proxy_read_timeout 1d;
proxy_send_timeout 1d;

# Backends enforce their own upload limits
client_max_body_size 0;

# Tailscale speaks HTTPS, nginx plain HTTP: keep redirects scheme-free
absolute_redirect off;

# ---- agents.<tailnet>: index + apps that live under a path ------------------

server {
  listen 127.0.0.1:8080 default_server;
  root   @site@;

  location = / {
    try_files /index.html =404;
  }

  # ~/public directory listing (packages/html-serving)
  location /public/ {
    proxy_pass     http://127.0.0.1:8765/;
    # It redirects `dir` → `/dir/`, unaware of the prefix
    proxy_redirect / /public/;
  }

  # XFCE desktop over noVNC (module-cua-desktop.nix)
  location /desktop/ {
    proxy_pass http://127.0.0.1:6080/;
  }

  # Short links to what needs a whole origin
  location = /t3 {
    return 302 https://t3.$tailnet/;
  }

  # Udex preview still owns its route (udex repo, docker/preview). To move
  # it behind this gateway: bind its nginx on loopback, proxy udex.* here,
  # define svc:udex, and point ALLOWED_ORIGINS + WEBAUTHN_RP_ID at
  # udex.<tailnet> (existing passkeys must be registered again).
  location = /udex {
    return 302 https://$host:8443/;
  }

  location / {
    return 404;
  }
}

# ---- t3.<tailnet>: T3 Code (module-slopbox.nix) -----------------------------

server {
  listen      127.0.0.1:8080;
  server_name t3.*;

  location / {
    proxy_pass http://127.0.0.1:3773;
  }
}
