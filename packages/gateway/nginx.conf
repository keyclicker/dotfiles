# Front door of the agents box. Tailscale terminates HTTPS on 443 and
# forwards it here; the path picks the app. Included into nginx's http
# block by .nix/module-gateway.nix, which substitutes @site@.

# ---- Shared proxy behaviour -------------------------------------------------

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

proxy_http_version 1.1;
proxy_set_header   Host       $host;
proxy_set_header   Upgrade    $http_upgrade;
proxy_set_header   Connection $connection_upgrade;

# noVNC holds its websocket open for hours
proxy_read_timeout 1d;
proxy_send_timeout 1d;

# Backends enforce their own upload limits
client_max_body_size 0;

# Tailscale speaks HTTPS, nginx plain HTTP: keep redirects scheme-free
absolute_redirect off;

# ---- Index + apps that live under a path ------------------------------------

server {
  listen 127.0.0.1:8080 default_server;
  root   @site@;

  location = / {
    try_files /index.html =404;
  }

  # ~/public directory listing (packages/html-serving)
  location /public/ {
    proxy_pass     http://127.0.0.1:8765/;
    # It redirects `dir` → `/dir/`, unaware of the prefix
    proxy_redirect / /public/;
  }

  # XFCE desktop over noVNC (module-cua-desktop.nix)
  location /desktop/ {
    proxy_pass http://127.0.0.1:6080/;
  }

  # Apps that load assets from `/` need a whole origin, so they keep
  # their own tailnet ports; these are short links for the index.

  # T3 Code (module-slopbox.nix)
  location = /t3 {
    return 302 https://$host:3773/;
  }

  # Udex preview owns its route (udex repo, docker/preview)
  location = /udex {
    return 302 https://$host:8443/;
  }

  location / {
    return 404;
  }
}
